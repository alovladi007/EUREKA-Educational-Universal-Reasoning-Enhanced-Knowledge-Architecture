# OCTET stack. Attaches to the EUREKA network so it can reach api-core for
# identity and entitlements, exactly as AXIOM does.
#
# Port band. EUREKA holds 4040/4041/8000/5434/6381 and AXIOM holds
# 4100/8400/5441/6392, so OCTET takes 4200/8500/5442/6393.

services:
  postgres:
    image: postgres:16-alpine
    container_name: octet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: octet
      POSTGRES_PASSWORD: octet
      POSTGRES_DB: octet
    ports:
      - "5442:5432"
    volumes:
      - octet_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octet"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: octet-redis
    restart: unless-stopped
    ports:
      - "6393:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: octet-api
    restart: unless-stopped
    environment:
      OCTET_ENVIRONMENT: local
      OCTET_DATABASE_URL: postgresql+asyncpg://octet:octet@postgres:5432/octet
      OCTET_REDIS_URL: redis://redis:6379/0
      OCTET_EUREKA_API_URL: http://api-core:8000
      OCTET_IDENTITY_PROVIDER: hmac
      # Must match EUREKA's JWT secret for the SSO bridge to verify tokens.
      # Accepts either variable name (.env.example uses OCTET_JWT_SECRET; the
      # bare fallback broke cross-service auth silently when neither was set).
      OCTET_JWT_SECRET: ${OCTET_JWT_SECRET:-${JWT_SECRET:-dev-secret-change-me}}
      OCTET_GRADING_SANDBOX: "true"
    ports:
      - "8500:8500"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - eureka-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: octet-web
    restart: unless-stopped
    environment:
      # The browser resolves these, not the container, so they are host
      # addresses rather than service names.
      NEXT_PUBLIC_OCTET_API_URL: http://localhost:8500
      NEXT_PUBLIC_EUREKA_LOGIN_URL: http://localhost:4040/auth/login
    ports:
      - "4200:4200"
    depends_on:
      - api
    networks:
      - default
      - eureka-network

volumes:
  octet_pg:

networks:
  eureka-network:
    external: true
