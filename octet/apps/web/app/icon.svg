<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OCTET">
  <!-- The octet rule, which the module is named for: eight valence electrons
       around a shell. Drawn in brand-600 (#0284c7), the EUREKA blue the rest
       of the app uses, so the tab icon does not read as a different product
       from the one the learner came in through. -->
  <rect width="32" height="32" rx="7" fill="#0284c7"/>
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.25"/>
  <g fill="#ffffff">
    <circle cx="16" cy="6.5" r="2.6"/>
    <circle cx="22.72" cy="9.28" r="2.6"/>
    <circle cx="25.5" cy="16" r="2.6"/>
    <circle cx="22.72" cy="22.72" r="2.6"/>
    <circle cx="16" cy="25.5" r="2.6"/>
    <circle cx="9.28" cy="22.72" r="2.6"/>
    <circle cx="6.5" cy="16" r="2.6"/>
    <circle cx="9.28" cy="9.28" r="2.6"/>
  </g>
</svg>
